; SenateScan settings. Save this file and restart SenateScan (right-click its icon near the clock, Exit, then start it again).

; Port the scanner utility listens on (this computer only). The website script uses the same number.
Port=47600

; Adds a "Demo scanner" that makes test pages, so the Scan button can be tried without a scanner.
; Set to false once real scanners are in use.
EnableDemo=true

; Network copier that saves scans into a shared folder ("scan to folder"): put the folder here,
; for example  \\fileserver\scans   The Scan dialog will then offer the newest files in it.
ScanFolder=

; Only files newer than this many hours are offered from the scan folder.
FolderAgeHours=168

; Websites may use the scanner when they are on this network: local names (http://notice), private
; addresses (172.16.x.x, 10.x.x.x, 192.168.x.x) and names ending in .local or .lan.
; If the Notice website is reached by a full name such as https://notice.senate.gov.pk, list it here
; (several addresses can be separated by commas):
AllowedOrigins=http://notice.senate.gov.pk,https://notice.senate.gov.pk,https://legis.senate.gov.pk
